name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pip install -r requirements.txt  # add when present
          pip install pytest pytest-asyncio temporalio 2>/dev/null || true

      - name: Lint (placeholder)
        run: echo "Add ruff/black when requirements are defined"

      - name: Unit tests (placeholder)
        run: |
          if [ -d tests ]; then
            pytest tests/ -q || true
          else
            echo "No tests directory yet — agents should add tests with T-002/T-003"
          fi

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose config
