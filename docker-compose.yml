version: "3.9"

# Synkra local development & agentic loop environment
# Usage: docker compose up -d
# Temporal UI: http://localhost:8080
# Postgres: localhost:5432 (synkra/synkra)

networks:
  synkra:
    driver: bridge

volumes:
  pgdata:
  redisdata:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synkra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synkra}
      POSTGRES_DB: ${POSTGRES_DB:-synkra}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synkra} -d ${POSTGRES_DB:-synkra}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - synkra
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - synkra
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.25.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-synkra}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-synkra}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    networks:
      - synkra
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.31.0
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - synkra
    restart: unless-stopped

